version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile_app
    env_file:
      - .env
    environment:
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY}
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
      - "127.0.0.1:${SSH_PORT_APP:-2222}:22"
    networks:
      - project_net
    deploy:
      resources:
        limits:
          cpus: "2"
    restart: unless-stopped

  tester:
    build:
      context: .
      dockerfile: Dockerfile_tester
    env_file:
      - .env
    environment:
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY}
      - APP_HOST=${APP_HOST:-app}
      - APP_INTERNAL_PORT=${APP_INTERNAL_PORT:-5000}
      - APP_SRC_DIR=/app
    ports:
      - "127.0.0.1:${SSH_PORT_TESTER:-2223}:22"
      - "127.0.0.1:3000:3000"
    networks:
      - project_net
    deploy:
      resources:
        limits:
          cpus: "2"
    depends_on:
      - app
    restart: unless-stopped

networks:
  project_net:
    driver: bridge
